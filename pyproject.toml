[build-system]
requires = ["flit_core >=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "streamcables"
version = "0.2.0"
description = "StreamCables does streaming metadata syndication"
authors = [{ name = "Sander van Dragt", email = "sander@vandragt.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
    "beautifulsoup4",
    "requests",
    "toml",
    "maya",
    "tweepy",
    "appdirs",
]

[project.urls]
Homepage = "https://vandragt.com/streamcables"

[dependency-groups]
dev = ["ruff", "rope", "flit", "pytest", "pytest-cov"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = ["LOG015"] # project logs via the root logger throughout, not per-module loggers

[tool.pytest.ini_options]
testpaths = ["tests"]
